<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>PassportSnap — Free Privacy-First Passport Photo Generator & Visa Maker</title>
    <meta name="description" content="Generate print-ready passport and visa photo sheets entirely in your browser for free. No uploads, no account signup, no tracking. Crop, edit, and export to PDF in standard sizes like 2x2 inches, 35x45mm, and more." />
    <meta name="keywords" content="free passport photo generator, passport photo maker, visa photo creator, crop 2x2 passport photo, online visa photo tool, 35x45mm generator, printable photo sheet, privacy-focused photo editor, local passport crop" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://passportsnap.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="PassportSnap — Free Privacy-First Passport Photo Generator & Visa Maker" />
    <meta property="og:description" content="Create print-ready passport and visa photo PDF sheets locally in your browser. Zero uploads. Zero tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://passportsnap.com/" />
    <meta property="og:image" content="https://passportsnap.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PassportSnap — Free Privacy-First Passport Photo Generator & Visa Maker" />
    <meta name="twitter:description" content="Create print-ready passport and visa photo PDF sheets locally in your browser. Zero uploads. Zero tracking." />
    <meta name="twitter:image" content="https://passportsnap.com/og-image.png" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PassportSnap",
      "alternateName": "Passport Photo Generator",
      "url": "https://passportsnap.com/",
      "image": "https://passportsnap.com/og-image.png",
      "description": "A free, privacy-first web application to crop, edit, and layout passport/visa photos into print-ready PDF sheets locally in the browser.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript and HTML5 Canvas. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
      },
      "featureList": [
        "100% Client-side image processing",
        "Multiple passport size presets (2x2\", 35x45mm, etc.)",
        "Custom margins, spacing, and borders",
        "Live photo editing: brightness, contrast, saturation, temperature, sharpening",
        "Arbitrary image rotation",
        "Direct PDF sheet download"
      ]
    }
    </script>

    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' blob:;
      script-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' blob: data:;
      connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
      frame-src 'self' blob:;
      worker-src 'self' blob:;
    " />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
